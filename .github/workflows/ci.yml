name: Firmware host CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        app: [esp32-energy, esp32-water]
    steps:
      - uses: actions/checkout@v5
      - name: Compile and run host tests
        working-directory: apps/${{ matrix.app }}
        run: |
          mapfile -t sources < <(jq -r '.sources[]' host.json)
          include="$(jq -r '.include' host.json)"
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -O2 -I "$include" "${sources[@]}" -o /tmp/cidade-viva-tests
          /tmp/cidade-viva-tests
  telemetry-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - app: esp32-energy
            profile: energy-telemetry
          - app: esp32-water
            profile: water-telemetry
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0
      - name: Build telemetry firmware
        run: pio run --project-dir apps/${{ matrix.app }} -e ${{ matrix.profile }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-${{ github.sha }}
          path: apps/${{ matrix.app }}/.pio/build/${{ matrix.profile }}/firmware.bin
          if-no-files-found: error
