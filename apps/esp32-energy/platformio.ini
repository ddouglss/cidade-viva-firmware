[platformio]
default_envs = energy-disabled
src_dir = .
include_dir = include

; Boot/USB profile only. External pinout is NOT approved.
[env:energy-disabled]
platform = platformio/espressif32@6.13.0
board = esp32dev
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.41100.260830
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
upload_speed = 115200
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_filter =
    +<src/*.cpp>
    +<firmware/main.cpp>

; Explicit opt-in bench profile: one red LED + 220 ohm resistor on G26/GND.
[env:energy-led26-test]
extends = env:energy-disabled
build_src_filter =
    +<src/*.cpp>
    +<firmware/led26_main.cpp>

[env:energy-wifi-test]
extends = env:energy-disabled
build_flags =
    ${env:energy-disabled.build_flags}
    -DCIDADE_VIVA_WIFI_TEST

; Telemetry-only profile. No physical outputs or measurements are enabled.
[env:energy-telemetry]
extends = env:energy-disabled
lib_deps =
    256dpi/MQTT@2.5.3
    Preferences
    WiFi
build_src_filter =
    +<src/*.cpp>
    +<firmware/telemetry_main.cpp>
