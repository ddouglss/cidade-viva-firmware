[platformio]
default_envs = water-disabled
src_dir = .
include_dir = include

; Boot/USB profile only. No approved pump, float or sensor GPIO.
[env:water-disabled]
platform = platformio/espressif32@6.13.0
board = esp32dev
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
    espressif/toolchain-xtensa-esp32@8.4.0+2021r2-patch5
    platformio/tool-esptoolpy@2.41100.260830
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_upload.flash_size = 4MB
upload_speed = 115200
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
build_src_filter =
    +<src/*.cpp>
    +<firmware/main.cpp>

; Bench input only; this profile never maps contact to water-present.
[env:water-float27-test]
extends = env:water-disabled
build_src_filter =
    +<src/*.cpp>
    +<firmware/float27_main.cpp>

; Raw sensor bench test only; no calibration or pump activation.
[env:water-soil34-test]
extends = env:water-disabled
build_src_filter =
    +<src/*.cpp>
    +<firmware/soil34_main.cpp>

[env:water-monitor]
extends = env:water-disabled
build_src_filter =
    +<src/*.cpp>
    +<firmware/monitor_main.cpp>

[env:water-wifi-test]
extends = env:water-monitor
build_flags =
    ${env:water-monitor.build_flags}
    -DCIDADE_VIVA_WIFI_TEST
